name: Terraform Pipeline

on:
  push:
    branches:
      - master
      - dev
      - staging
  pull_request:
    branches:
      - master
      - dev
      - staging
      - "feature/**"
      - develop
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Project folder to deploy (relative to repo root). Leave blank to use the default project."
        required: false

env:
  # 1.12 = the Terraform Associate 004 baseline. Needed for ephemeral values
  # (1.10+) and write-only arguments (1.11+). State written by 1.12 can't be
  # read by older CLIs, so never pin this back down.
  TERRAFORM_VERSION: "1.12.2"
  DEFAULT_PROJECT_DIR: "projects/plx-sandbox-app"
  # Non-interactive mode: Terraform fails fast on missing input instead of
  # waiting for a prompt until the job times out.
  TF_IN_AUTOMATION: "true"

permissions:
  id-token: write
  contents: read
  # Read-only: lets the image verify gate fetch build attestations.
  attestations: read

jobs:
  detect-changes:
    name: Detect Changed Modules & Projects
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      projects: ${{ steps.detect.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules & projects
        id: detect
        run: |
          to_json() { jq -R 'select(length > 0)' | jq -sc .; }

          ALL_MODULES=$(find modules -mindepth 2 -maxdepth 2 -type d | sort)
          ALL_PROJECTS=$(find projects -mindepth 1 -maxdepth 1 -type d | sort)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run is a deliberate human action - validate every
            # module as a full safety net rather than inferring intent.
            MODULES="$ALL_MODULES"
            PROJECTS="${{ inputs.working_directory }}"
            [ -z "$PROJECTS" ] && PROJECTS="$DEFAULT_PROJECT_DIR"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
            else
              BASE="${{ github.event.before }}"
            fi

            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              echo "No valid base commit to diff against - treating everything as changed"
              MODULES="$ALL_MODULES"
              PROJECTS="$ALL_PROJECTS"
            else
              CHANGED_FILES=$(git diff --name-only "$BASE" "${{ github.sha }}")
              MODULES=$(echo "$CHANGED_FILES" | grep '^modules/' | cut -d/ -f1-3 | sort -u)
              PROJECTS=$(echo "$CHANGED_FILES" | grep '^projects/' | cut -d/ -f1-2 | sort -u)

              # A project must also be re-planned when a module it consumes
              # changes, otherwise a module fix merges and never deploys.
              # Match the path followed by `"` or `/` so e.g. function-app
              # doesn't also match function-app-flex.
              for p in $ALL_PROJECTS; do
                for m in $MODULES; do
                  if grep -rEqs --include='*.tf' "${m}(\"|/)" "$p"; then
                    PROJECTS="$PROJECTS"$'\n'"$p"
                    break
                  fi
                done
              done
            fi
          fi

          # Deleted directories still show up in the diff - keep only ones
          # that exist so plan never targets a path that's gone.
          MODULES=$(for d in $MODULES; do [ -d "$d" ] && echo "$d"; done | sort -u | to_json)
          PROJECTS=$(for d in $PROJECTS; do [ -d "$d" ] && echo "$d"; done | sort -u | to_json)

          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          echo "Changed modules: $MODULES"
          echo "Projects to plan: $PROJECTS"

  validate-and-scan:
    name: Terraform Validate & Security Scan
    needs: detect-changes
    # Only runs as the PR-time gate (or on a manual run). A pull_request
    # event checks out the hypothetical merge result, so re-running this
    # again on the post-merge push would check identical content in the
    # common case - pure duplicate work. Trade-off: a squash-merge with
    # subtly different final content, or a direct push bypassing the PR
    # flow, would not get re-checked here - acceptable given branch
    # protection already requires a PR for a solo-maintained repo; revisit
    # if this repo ever gets more contributors.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Fmt (recursive, whole repo)
        run: terraform fmt -check -recursive .

      # Projects are validated here too, not just modules - otherwise a
      # broken project passes the PR and only fails at post-merge plan.
      - name: Terraform Init & Validate (changed modules and projects)
        run: |
          TARGETS=$(jq -nr \
            --argjson m '${{ needs.detect-changes.outputs.modules }}' \
            --argjson p '${{ needs.detect-changes.outputs.projects }}' \
            '$m + $p | .[]')
          echo "Validating: $(echo $TARGETS)"
          FAILED=0
          for d in $TARGETS; do
            echo "--- $d ---"
            if ! (cd "$d" && terraform init -backend=false -input=false && terraform validate); then
              echo "[FAIL] $d"
              FAILED=1
            fi
          done
          exit $FAILED

      # Unlike the scans below, this gate blocks: an image that wasn't signed
      # by our own pipeline must never reach a merge.
      - name: Verify container images (signature + provenance)
        uses: ./.github/actions/verify-images
        with:
          paths: ${{ join(fromJson(needs.detect-changes.outputs.projects), ' ') }}

      # Gitleaks: fast, pure pattern-matching secret scan, no network calls.
      # (TruffleHog was dropped - same job, but its live-credential
      # verification step makes it much slower for no real benefit on a
      # repo with no actual secrets ever committed.)
      - name: Gitleaks Secret Scan (Docker Method)
        run: |
          echo "Running Gitleaks via Docker..."
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact || true

      # Checkov: actively-maintained IaC misconfiguration scanner with the
      # broadest rule coverage of the IaC scanners considered. (tfsec and
      # Terrascan were dropped - tfsec is archived upstream in favor of
      # Trivy, and Terrascan's coverage significantly overlaps Checkov's.)
      - name: Checkov Scan
        run: |
          echo "Installing Checkov"
          pip install checkov

          echo "Running Checkov with JSON output"
          checkov -d . -o json > checkov.json || true

      - name: AI Terraform Risk Analyzer
        run: |
          echo "Running AI Terraform Risk Analyzer..."
          python3 risk-engine/ai-risk.py

  plan:
    name: Terraform Plan
    needs: [detect-changes, validate-and-scan]
    # Only plan/apply on an actual branch push or a manual run - never on a
    # bare PR-open, since that would attempt to plan code that isn't merged
    # into dev/staging/master yet. validate-and-scan is skipped (not failed)
    # on a push event by design - proceed in that case, only block if it
    # actually ran (PR/manual) and failed. Also skip entirely if nothing
    # needs planning - an empty matrix errors otherwise.
    if: |
      always() &&
      (needs.validate-and-scan.result == 'success' || needs.validate-and-scan.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        working_directory: ${{ fromJson(needs.detect-changes.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Serialize deploys per branch+project so two pushes in quick
      # succession queue instead of racing the same state file.
      group: deploy-${{ github.ref_name }}-${{ matrix.working_directory }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: resolve
        uses: ./.github/actions/resolve-environment
        with:
          branch: ${{ github.ref_name }}
          working_directory: ${{ matrix.working_directory }}

      # Checked again at deploy time, before touching Azure, so a direct push
      # that skipped the PR gate still can't deploy an unverified image.
      - name: Verify container images (signature + provenance)
        uses: ./.github/actions/verify-images
        with:
          paths: ${{ matrix.working_directory }}

      - name: Terraform Azure Init
        uses: ./.github/actions/terraform-azure-init
        with:
          working_directory: ${{ matrix.working_directory }}
          environment: ${{ steps.resolve.outputs.environment }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ steps.resolve.outputs.subscription_id }}
          backend_storage_account: ${{ steps.resolve.outputs.storage_account }}

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present.
      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.working_directory }}
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode \
            -var-file="${{ steps.resolve.outputs.environment }}.tfvars" -out=tfplan
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 1 ]; then exit 1; fi
          if [ "$EXIT" -eq 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Puts the plan on the run page, so whoever approves the apply gate
      # sees exactly what they're approving. Sensitive values are redacted
      # by `terraform show`.
      - name: Publish plan to run summary
        working-directory: ${{ matrix.working_directory }}
        run: |
          {
            echo "## ${{ matrix.working_directory }} → ${{ steps.resolve.outputs.environment }}"
            if [ "${{ steps.plan.outputs.changed }}" = "true" ]; then
              echo '```'
              terraform show -no-color tfplan
              echo '```'
            else
              echo "No changes - apply will be skipped for this project."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The binary plan file holds every value in plaintext, including
      # sensitive ones, and this repo is public - keep it for the minimum
      # time apply could need it.
      - name: Upload plan artifact
        if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.resolve.outputs.environment }}-${{ steps.resolve.outputs.artifact_suffix }}
          path: ${{ matrix.working_directory }}/tfplan
          retention-days: 1

      # Matrix job outputs don't fan out per-entry to downstream jobs, so
      # each entry records its result as a tiny artifact that plan-results
      # aggregates.
      - name: Record plan status
        run: |
          mkdir -p plan-status
          echo "${{ matrix.working_directory }}|${{ steps.plan.outputs.changed }}" \
            > "plan-status/${{ steps.resolve.outputs.artifact_suffix }}.status"

      - name: Upload plan status
        uses: actions/upload-artifact@v4
        with:
          name: planstatus-${{ steps.resolve.outputs.artifact_suffix }}
          path: plan-status/
          retention-days: 1

  plan-results:
    name: Collect Plan Results
    needs: plan
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      changed_projects: ${{ steps.collect.outputs.changed_projects }}
    steps:
      - name: Download plan statuses
        uses: actions/download-artifact@v4
        with:
          pattern: planstatus-*
          path: plan-status
          merge-multiple: true

      - name: Collect projects with changes
        id: collect
        run: |
          CHANGED=$(cat plan-status/*.status | awk -F'|' '$2 == "true" { print $1 }' | jq -R 'select(length > 0)' | jq -sc .)
          echo "changed_projects=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Projects with changes to apply: $CHANGED"

  apply:
    name: Terraform Apply
    needs: plan-results
    # always() overrides the implicit skip-cascade pre-check (validate-and-scan
    # is skipped on push by design). Only projects whose plan actually has
    # changes reach the approval gate - no-op plans don't ask for approval.
    if: |
      always() &&
      needs.plan-results.result == 'success' &&
      needs.plan-results.outputs.changed_projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        working_directory: ${{ fromJson(needs.plan-results.outputs.changed_projects) }}
    runs-on: ubuntu-latest
    # Every environment (dev/staging/prod) pauses here for manual approval.
    # This key is evaluated before any step runs, so it can't reference
    # steps.resolve's output - inline the branch->environment mapping.
    environment: ${{ (github.ref_name == 'master' && 'prod' || github.ref_name) }}-terraform
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref_name }}-${{ matrix.working_directory }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: resolve
        uses: ./.github/actions/resolve-environment
        with:
          branch: ${{ github.ref_name }}
          working_directory: ${{ matrix.working_directory }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ steps.resolve.outputs.environment }}-${{ steps.resolve.outputs.artifact_suffix }}
          path: ${{ matrix.working_directory }}

      - name: Terraform Azure Init
        uses: ./.github/actions/terraform-azure-init
        with:
          working_directory: ${{ matrix.working_directory }}
          environment: ${{ steps.resolve.outputs.environment }}
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ steps.resolve.outputs.subscription_id }}
          backend_storage_account: ${{ steps.resolve.outputs.storage_account }}

      # Applies exactly the reviewed plan. If state moved since plan ran,
      # Terraform rejects the stale plan rather than applying something else.
      - name: Terraform Apply
        working-directory: ${{ matrix.working_directory }}
        run: terraform apply -input=false tfplan
