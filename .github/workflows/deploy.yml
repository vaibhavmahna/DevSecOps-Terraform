name: Terraform Deploy

on:
  # Only runs after "Terraform Security CI" finishes on dev/staging/master -
  # see the job-level `if` below, which skips this entirely unless that run
  # succeeded. This keeps plan/apply from racing the validate/security scan
  # in parallel off the same push.
  workflow_run:
    workflows: ["Terraform Security CI"]
    types:
      - completed
    branches:
      - dev
      - staging
      - master
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Project folder to deploy (relative to repo root). Leave blank to use the default."
        required: false

env:
  TERRAFORM_VERSION: "1.9.8"
  DEFAULT_PROJECT_DIR: "projects/plx-sandbox-app"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    concurrency:
      # Serialize deploys per branch/environment so two pushes in quick
      # succession queue instead of racing the same state file.
      group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false
    env:
      # Force the azurerm provider/backend to use native OIDC auth instead of
      # auto-detecting the az-login CLI session from the step below (that
      # session is a Service Principal login, which azurerm's CLI auth mode
      # explicitly refuses - "only supported as a User").
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      working_directory: ${{ steps.resolve.outputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a workflow_run trigger, github.ref/github.sha point at the
          # default branch, not the commit that actually triggered CI - pin
          # to that exact commit instead.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve environment & working directory
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          case "$BRANCH" in
            dev) ENVIRONMENT=dev ;;
            staging) ENVIRONMENT=staging ;;
            master) ENVIRONMENT=prod ;;
            *) echo "Unsupported branch for deploy: $BRANCH"; exit 1 ;;
          esac

          WORKING_DIRECTORY="${{ inputs.working_directory }}"
          if [ -z "$WORKING_DIRECTORY" ]; then
            WORKING_DIRECTORY="$DEFAULT_PROJECT_DIR"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "working_directory=$WORKING_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "Deploying $WORKING_DIRECTORY to $ENVIRONMENT (branch: $BRANCH)"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ steps.resolve.outputs.working_directory }}
        run: |
          terraform init \
            -backend-config="key=terraform.tfstate" \
            -backend-config="resource_group_name=PA-Terraform" \
            -backend-config="storage_account_name=plixaterraform" \
            -backend-config="container_name=${{ steps.resolve.outputs.environment }}-tfstate"

      - name: Terraform Validate
        working-directory: ${{ steps.resolve.outputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ steps.resolve.outputs.working_directory }}
        run: terraform plan -var-file="${{ steps.resolve.outputs.environment }}.tfvars" -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.resolve.outputs.environment }}
          path: ${{ steps.resolve.outputs.working_directory }}/tfplan

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    # Every environment (dev/staging/prod) pauses here for manual approval.
    # Configure required reviewers under Settings > Environments for each
    # of dev-terraform, staging-terraform, and prod-terraform.
    environment: ${{ needs.plan.outputs.environment }}-terraform
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.plan.outputs.environment }}
          path: ${{ needs.plan.outputs.working_directory }}

      - name: Terraform Init
        working-directory: ${{ needs.plan.outputs.working_directory }}
        run: |
          terraform init \
            -backend-config="key=terraform.tfstate" \
            -backend-config="resource_group_name=PA-Terraform" \
            -backend-config="storage_account_name=plixaterraform" \
            -backend-config="container_name=${{ needs.plan.outputs.environment }}-tfstate"

      - name: Terraform Apply
        working-directory: ${{ needs.plan.outputs.working_directory }}
        run: terraform apply tfplan
