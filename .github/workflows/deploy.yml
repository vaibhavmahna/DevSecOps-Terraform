name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "sandbox"
        type: choice
        options:
          - sandbox
          - dev
          - prod
      working_directory:
        description: "Project folder to deploy (relative to repo root)"
        required: true
        default: "projects/plx-sandbox-app"

env:
  TERRAFORM_VERSION: "1.9.8"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform init \
            -backend-config="key=${{ inputs.environment }}.terraform.tfstate" \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=sttfstateplx" \
            -backend-config="container_name=tfstate"

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan -var-file="${{ inputs.environment }}.tfvars" -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    # Configure this environment under Settings > Environments with required
    # reviewers to get a manual approval gate before apply runs.
    environment: ${{ github.event.inputs.environment }}-terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform init \
            -backend-config="key=${{ inputs.environment }}.terraform.tfstate" \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=sttfstateplx" \
            -backend-config="container_name=tfstate"

      - name: Terraform Apply
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply tfplan
