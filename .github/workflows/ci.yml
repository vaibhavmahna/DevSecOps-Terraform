name: Terraform Security CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - "feature/**"
      - develop

env:
  TERRAFORM_VERSION: "1.9.8"

jobs:
  validate-and-scan:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Fmt, Init & Validate (all modules)
        run: |
          echo "==> Terraform FMT (recursive)"
          terraform fmt -check -recursive .

          echo "==> Terraform Init & Validate (per module)"
          FAILED=0
          for m in modules/*/*/; do
            echo "--- $m ---"
            if ! (cd "$m" && terraform init -backend=false -input=false && terraform validate); then
              echo "[FAIL] $m"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Gitleaks Secret Scan (Docker Method)
        run: |
          echo "Running Gitleaks via Docker..."
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-banner --redact || true

      - name: TruffleHog Deep Secret Scan
        run: |
          echo "Running TruffleHog Deep Secret Scan via Docker..."
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            trufflesecurity/trufflehog:latest \
            filesystem /repo || true

      - name: tfsec Scan
        run: |
          echo "Installing tfsec"
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

          echo "Running tfsec with JSON output"
          tfsec . --format json --out tfsec.json || true

      - name: Checkov Scan
        run: |
          echo "Installing Checkov"
          pip install checkov

          echo "Running Checkov with JSON output"
          checkov -d . -o json > checkov.json || true

      - name: AI Terraform Risk Analyzer
        run: |
          echo "Running AI Terraform Risk Analyzer..."
          python3 risk-engine/ai-risk.py

      - name: Terrascan Scan
        run: |
          echo "Running Terrascan..."
          docker run --rm \
            -v ${{ github.workspace }}:/iac \
            tenable/terrascan:latest \
            scan -d /iac || true

  build:
    name: Build Stage
    needs: validate-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Plixa-IaC artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plixa-IaC
          path: |
            .
            !.git/**
