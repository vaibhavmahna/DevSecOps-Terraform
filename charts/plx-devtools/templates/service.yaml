apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plx-devtools.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "plx-devtools.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
